# Runs what `make check` runs locally: no phone, no radio, no secrets. After dmd2-lora-bridge's,
# without its release job until there are releases.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runners pinned rather than ubuntu-latest: an image change should arrive as a commit with a green
# run, not as a red one nobody caused.
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Licences only: Gradle fetches what is missing. packages: '' because the action's default
      # asks for `tools`, which Google has removed (dmd2-lora-bridge).
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      # v5, not v6: v6 moved its caching into a proprietary component under separate terms.
      - uses: gradle/actions/setup-gradle@v5
      - run: make check-android
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Toolchain and framework are ~1 GB of download; the key covers the board set.
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      # Pinned like the platform in platformio.ini: the CLI is a build input too.
      - run: pip install platformio==6.1.19
      - run: make check-firmware check-tools

  nrf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Zephyr, its modules and the SDK's ARM toolchain: about 3 GB, made once per setup.sh.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/zephyr-ws
          key: zephyr-${{ runner.os }}-${{ hashFiles('firmware/zephyr/setup.sh') }}
      - run: firmware/zephyr/setup.sh "$RUNNER_TEMP/zephyr-ws"
      - run: make check-nrf ZEPHYR_WS="$RUNNER_TEMP/zephyr-ws"
