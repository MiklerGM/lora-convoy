; The Heltec V4.3 build. The Wio Tracker L1 Pro builds on Zephyr instead: make nrf.
;
; Pinned, as in dmd2-lora-bridge: an unpinned platform once changed ESP-IDF's major version
; between a local build and CI.
[env]
platform = espressif32@7.1.2
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv

[env:heltec_v4]
; Heltec WiFi LoRa 32 V4.3 with Heltec's GNSS kit (an L76K). The radio and its KCT8103L front end
; are sx1262.h's defaults; the GNSS lines are Meshtastic's heltec_v4 variant. The V3's board file
; serves the V4.3, as it did for dmd2-lora-bridge.
board = heltec_wifi_lora_32_V3
build_flags =
    -DPIN_PAIR_BUTTON=0
    -DPIN_GNSS_TX=38
    -DPIN_GNSS_RX=39
    -DPIN_GNSS_EN=34
    -DPIN_GNSS_RESET=42
    -DPIN_GNSS_STANDBY=40
    -DPIN_GNSS_PPS=41
    ; without PPS (no fix yet, or lost): this board's own lag= by sats=, 3 310 status lines, 2026-11-12
    -DNODE_NMEA_LAG_US=160000
    -DNODE_NMEA_LAG_SAT_US=6900
    -DNODE_NMEA_ERR_US=100000
    ; measured on one board, 2026-11-11 (docs/07): txlead= 7.9/8.0/8.9 ms over 10 521 packets
    -DNODE_TX_LEAD_US=8000
